backend:
  name: github
  repo: atensaiadmin/saykanone
  branch: main
  base_url: https://saykan-cms-oauth.atensailabhub.workers.dev
  auth_endpoint: auth

media_folder: public/assets/img
public_folder: /assets/img

collections:
  - name: settings
    label: Site Settings
    files:
      - label: Site Info
        name: site
        file: content/site.json
        fields:
          - { label: Brand Name, name: brand, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Facebook URL, name: facebook, widget: string }

  - name: hero
    label: Hero Section
    files:
      - label: Hero
        name: hero
        file: content/hero.json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: list, field: { label: Part, name: part, widget: string } }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Lead Paragraph, name: lead, widget: text }
          - label: Primary CTA
            name: primaryCta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string, default: "#classes" }
          - label: Secondary CTA
            name: secondaryCta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string, default: "#grandmaster" }

  - name: about
    label: About Section
    files:
      - label: About
        name: about
        file: content/about.json
        fields:
          - { label: Kicker, name: kicker, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: list, field: { label: Paragraph, name: text, widget: text } }
          - label: Stats
            name: stats
            widget: list
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }

  - name: disciplines
    label: Disciplines
    files:
      - label: Disciplines List
        name: disciplines
        file: content/disciplines.json
        widget: list
        fields:
          - { label: ID, name: id, widget: string }
          - { label: Name, name: name, widget: string }
          - { label: Subtitle, name: sub, widget: string }
          - { label: Image Path, name: image, widget: string }
          - { label: Description, name: text, widget: text }

  - name: academy
    label: Academy (Classes)
    files:
      - label: Academy Info
        name: academy
        file: content/academy.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Address, name: address, widget: string }
          - { label: Schedule, name: schedule, widget: string }
          - { label: Curriculum, name: curriculum, widget: string }
          - { label: Instructor, name: instructor, widget: string }
          - { label: Notes, name: notes, widget: list, field: { label: Note, name: text, widget: text } }

  - name: grandmaster
    label: Grandmaster
    files:
      - label: Grandmaster Bio
        name: grandmaster
        file: content/grandmaster.json
        fields:
          - { label: Kicker, name: kicker, widget: string }
          - { label: Name, name: name, widget: string }
          - { label: Ranks, name: ranks, widget: string }
          - { label: Image Path, name: image, widget: string }
          - { label: Bio, name: bio, widget: list, field: { label: Paragraph, name: text, widget: text } }
          - { label: Philosophy Quote, name: philosophy, widget: text }

  - name: seminars
    label: Seminars
    files:
      - label: Seminars
        name: seminars
        file: content/seminars.json
        fields:
          - { label: Intro Text, name: intro, widget: text }
          - label: Highlights
            name: highlights
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Location, name: where, widget: string }
              - { label: Blurb, name: blurb, widget: text }
              - { label: Image Path, name: image, widget: string }
          - label: CTA
            name: cta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string, default: "#contact" }

  - name: principles
    label: Principles
    files:
      - label: Principles List
        name: principles
        file: content/principles.json
        widget: list
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Text, name: text, widget: text }

  - name: faqs
    label: FAQs
    files:
      - label: FAQ List
        name: faqs
        file: content/faqs.json
        widget: list
        fields:
          - { label: Question, name: q, widget: string }
          - { label: Answer, name: a, widget: text }
